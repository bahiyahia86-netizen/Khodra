  <path d="M76 24c1 2 2 3 2 5M80 23c0 2 1 4 1 5M84 25c-1 2-1 3-2 5" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <!-- broccoli/leaf top -->
  <circle cx="46" cy="30" r="7" fill="#22C55E"/>
  <circle cx="40" cy="34" r="5.5" fill="#16A34A"/>
  <circle cx="48" cy="36" r="5" fill="#15803D"/>
