  <path d="M86 76c-12-14-24-26-34-34" stroke="#ECFDF5" stroke-width="3" stroke-linecap="round" opacity=".7"/>
  <!-- Center veggies cluster -->
  <!-- tomato -->
  <circle cx="58" cy="42" r="9" fill="#EF4444"/>
  <circle cx="55" cy="39" r="2.2" fill="#FCA5A5" opacity=".7"/>
