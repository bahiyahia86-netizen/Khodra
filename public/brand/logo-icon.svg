<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="55%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="l1" x1="90" y1="120" x2="260" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="l2" x1="220" y1="100" x2="420" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#052e16" flood-opacity=".25"/>
    </filter>
  </defs>
  <!-- rounded app square -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <!-- left leaf -->
    <path d="M120 300c10-110 90-190 170-210-20 100-55 190-135 240-15-8-30-18-35-30z" fill="url(#l1)"/>
    <path d="M145 295c45-55 95-100 135-130" stroke="#16A34A" stroke-width="10" stroke-linecap="round" opacity=".35"/>
    <!-- right leaf -->
    <path d="M392 300c-10-110-90-190-170-210 20 100 55 190 135 240 15-8 30-18 35-30z" fill="url(#l2)"/>
    <path d="M367 295c-45-55-95-100-135-130" stroke="#14532D" stroke-width="10" stroke-linecap="round" opacity=".25"/>
    <!-- tomato accent -->
    <circle cx="256" cy="168" r="28" fill="#EF4444"/>
    <circle cx="246" cy="158" r="7" fill="#FECACA" opacity=".85"/>
    <path d="M236 146c8 4 16 4 24 0 4 6 10 10 16 10" stroke="#166534" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- small leaf top-right of tomato -->
    <ellipse cx="292" cy="138" rx="16" ry="10" transform="rotate(-35 292 138)" fill="#BBF7D0"/>
  </g>
</svg>
